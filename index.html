.hlogo{width:8px;height:36px;background:linear-gradient(180deg,var(--green-mid),var(--green-dark));border-radius:4px;}
.htitle{font-size:18px;font-weight:800;color:var(--green-dark);}
.hsub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.badges{display:flex;gap:8px;}
.badge{font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;}
.bg{background:var(--green-light);color:var(--green-dark);}
.br{background:var(--danger-light);color:var(--danger);}
.month-tabs{display:flex;gap:10px;padding:14px 28px 0;background:var(--bg);border-bottom:1px solid var(--border);}
.mtab{padding:10px 16px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-muted);background:var(--white);border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;transition:all .15s;line-height:1.5;min-width:90px;text-align:center;}
.mtab:hover{color:var(--green-dark);}
.mtab .mt-label{font-size:13px;font-weight:700;display:block;}
.mtab .mt-sub{font-size:10px;color:var(--text-sub);display:block;margin-top:2px;}
.mtab.active{background:var(--white);border-color:var(--border);border-bottom:2px solid var(--white);color:var(--green-dark);font-weight:800;box-shadow:0 -2px 0 var(--green);}
.mtab.active .mt-label{color:var(--green-dark);}
.mtab.active .mt-sub{color:var(--text-muted);}
.tabs{background:var(--white);border-bottom:2px solid var(--border);padding:0 28px;display:flex;align-items:flex-end;gap:0;}
.tab{padding:13px 18px 11px;cursor:pointer;border-bottom:3px solid transparent;color:var(--text-muted);transition:all .15s;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:-2px;}
.tab .tl{font-size:13px;font-weight:600;}
.tab .td{font-size:10px;color:var(--text-sub);}
.tab:hover{color:var(--green);}
.tab.active{color:var(--green-dark);border-bottom:3px solid var(--green);}
.tab.active .tl{font-weight:800;}
/* 누적 탭 전용 */
.acc-tab{margin-left:12px;padding:9px 16px 11px;border:1.5px dashed #93C5FD!important;border-bottom:3px solid transparent!important;border-radius:6px 6px 0 0;background:var(--white);color:#2563EB!important;}
.acc-tab.active{border:1.5px dashed #2563EB!important;border-bottom:3px solid #2563EB!important;background:#EFF6FF!important;color:#1D4ED8!important;}
.acc-tab .tl{font-size:12px;font-weight:700;}
.acc-tab .td{font-size:9px;color:#60A5FA;}
.content{padding:20px 28px;max-width:1200px;}
.section{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:20px;}
.stitle{font-size:14px;font-weight:800;color:var(--green-dark);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.ssub{font-size:11px;color:var(--text-muted);font-weight:400;background:var(--bg);padding:2px 8px;border-radius:10px;}
.chart-wrap{position:relative;height:260px;}
.cell-selector{display:flex;gap:10px;margin-bottom:0;}
.cell-btn{flex:1;background:var(--white);border:2px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:space-between;}
.cb-l{display:flex;align-items:center;gap:10px;}
.cb-dot{width:10px;height:10px;border-radius:50%;background:var(--border);}
.cb-name{font-size:15px;font-weight:800;color:var(--text-muted);}
.cb-r{text-align:right;}
.cb-avg{font-size:18px;font-weight:800;color:var(--text-muted);}
.cb-sub{font-size:10px;color:var(--text-sub);margin-top:2px;}
.cell-btn.active{border-color:var(--green);background:var(--green-pale);}
.cell-btn.active .cb-dot{background:var(--green);}
.cell-btn.active .cb-name,.cell-btn.active .cb-avg{color:var(--green-dark);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{background:var(--green-pale);padding:10px 12px;font-weight:700;font-size:11px;color:var(--green-dark);text-align:left;border-bottom:2px solid var(--green-light);}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}

.ln{font-weight:800;color:var(--danger);}
.tn{color:var(--text-muted);font-size:12px;}
.bw{display:flex;align-items:center;gap:8px;}
.bb{height:7px;border-radius:4px;background:var(--green-bar);}
.pn{font-size:12px;font-weight:800;min-width:38px;}
.pr{color:var(--danger);}.po{color:var(--warning);}.pg{color:var(--green);}
.ab{color:var(--danger);font-weight:700;}.ao{color:var(--warning);font-weight:700;}.ag{color:var(--green);font-weight:700;}

.rvb{font-size:11px;color:var(--green-dark);background:var(--green-light);border:none;padding:3px 8px;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:600;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;}
.overlay.open{display:block;}
.drawer{position:fixed;right:0;top:0;bottom:0;width:500px;background:var(--white);z-index:201;overflow-y:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:-6px 0 30px rgba(0,0,0,.14);}
.drawer.open{transform:translateX(0);}
.dh{padding:18px 22px;border-bottom:2px solid var(--green-light);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--white);z-index:10;}
.dh h3{font-size:14px;font-weight:800;color:var(--green-dark);flex:1;min-width:0;margin-right:8px;}
.dwt{font-size:11px;font-weight:700;background:var(--green-light);color:var(--green-dark);padding:3px 9px;border-radius:10px;white-space:nowrap;}
.dcb{cursor:pointer;background:none;border:none;font-size:22px;color:var(--text-muted);padding:2px 8px;border-radius:6px;flex-shrink:0;}
.db{padding:16px 22px;}
.rv{border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-bottom:10px;}
.rm{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap;}
.sc{font-size:12px;font-weight:800;padding:2px 9px;border-radius:12px;}

const labelPlugin={
  id:'customLabels',
  afterDraw(chart){
    const ctx=chart.ctx; ctx.save();
    // 막대 숫자 (안쪽 흰색)
    chart.data.datasets.forEach((ds,di)=>{
      if(ds.type!=='bar') return;
      const meta=chart.getDatasetMeta(di); if(meta.hidden) return;
      meta.data.forEach((el,i)=>{
        const val=ds.data[i]; if(val===0||val==null) return;
        const bH=el.base-el.y; if(bH<14) return;
        ctx.font='bold 11px Pretendard,-apple-system,sans-serif';
        ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(val+'%',el.x,el.y+bH/2);
      });
    });
    // 꺾은선 숫자 (막대 최상단보다 위에, 흰 배경 박스)
    chart.data.datasets.forEach((ds,di)=>{
      if(ds.type!=='line') return;
      const meta=chart.getDatasetMeta(di); if(meta.hidden) return;
      let barMeta=null;
      chart.data.datasets.forEach((ds2,di2)=>{ if(ds2.type==='bar') barMeta=chart.getDatasetMeta(di2); });
      meta.data.forEach((el,i)=>{
        const val=ds.data[i]; if(val==null) return;
        const barTop = barMeta ? (barMeta.data[i]?.y ?? el.y) : el.y;
        const labelY = Math.min(el.y, barTop) - 8;
        const label = String(val);
        ctx.font='bold 11px Pretendard,-apple-system,sans-serif';
        const tw = ctx.measureText(label).width;
        ctx.fillStyle='rgba(255,255,255,0.85)';
        ctx.fillRect(el.x-tw/2-3, labelY-12, tw+6, 14);
        ctx.fillStyle='#1B5E34'; ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillText(label, el.x, labelY);
      });
    });
    ctx.restore();
  }
};

function isAcc(){ return curWeek==='acc'; }
function getAccStats(month){ return ACC_DATA[month].acc; }

// ── 누적탭 헬퍼: 해당 월 전체 주차 리뷰 합산 ──
function getAccReviews(store){
  const cfg = MONTH_CONFIG[curMonth];
  const allWks = cfg.weeks;
  const reviews = cfg.reviews[store] || {};
  const all = [];
  allWks.forEach(wk => { (reviews[wk]||[]).forEach(r => all.push({...r, week: wk})); });
  return all;
}
function getAccStoreData(store){
  const tops = (ACC_DATA[curMonth]||{}).accTop || [];
  return tops.find(t=>t.store===store) || {total:0,low:0,pct:0.0,avg:0};
}

function getPrev(wk,weeks){const i=weeks.indexOf(wk);return i>0?weeks[i-1]:null;}
function pc(p){return p>=5?'pr':p>=3?'po':'pg';}
function ac(a){return a<4.4?'ab':a<4.6?'ao':'ag';}

function buildTabs(){
  const cfg=MONTH_CONFIG[curMonth];
  const hasAcc = !!ACC_DATA[curMonth];
  const allWks    = hasAcc ? [...cfg.weeks, 'acc'] : cfg.weeks;
  const allLabels = hasAcc ? [...cfg.weekLabels, '누적'] : cfg.weekLabels;
  const allDates  = hasAcc ? {...cfg.weekDates, acc:cfg.label+'월 전체'} : cfg.weekDates;
  document.getElementById('tabs').innerHTML = allWks.map((wk,i)=>{
    const isAccWk  = wk==='acc';
    const isActive = wk===curWeek;
    return `<div class="tab${isActive?' active':''}${isAccWk?' acc-tab':''}" data-week="${wk}">
      <span class="tl">${isAccWk?('📊 '+cfg.label+' 누적'):allLabels[i]}</span>
      <span class="td">${allDates[wk]||''}</span>
    </div>`;
  }).join('');
  // 이벤트는 위임 방식으로 처리 (아래 DOMContentLoaded)
}

function render(){
  // 탭 active 상태 항상 갱신
  document.querySelectorAll('#tabs .tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.week===curWeek);
  });
  const cfg=MONTH_CONFIG[curMonth];
  const wk=curWeek, cell=curCell;
  const prev = isAcc() ? null : getPrev(wk,cfg.weeks);
  const cData = isAcc() ? null : (cfg.cellWeek?.[cell] || {});
  const cur   = isAcc() ? (ACC_DATA[curMonth]?.accCell?.[cell] || {total:0,low:0,pct:0,avg:0}) : (cData?.[wk] || {total:0,low:0,pct:0,avg:0});
  const prevD = (prev && cData) ? (cData?.[prev] || null) : null;
  const wLabel=isAcc()?(cfg.label+'월 누적'):cfg.weekLabels[cfg.weeks.indexOf(wk)];

  const cellBtns=['1셀','2셀','3셀'].map(c=>{
    const accCellD = isAcc() ? (ACC_DATA[curMonth]?.accCell?.[c]||{avg:0,pct:0}) : null;
    const cw = isAcc() ? accCellD : (cfg.cellWeek?.[c]?.[wk] || {avg:0,pct:0});
    return `<button class="cell-btn${c===cell?' active':''}" onclick="selectCell('${c}')">
      <div class="cb-l"><div class="cb-dot"></div><div class="cb-name">${c}</div></div>
      <div class="cb-r"><div class="cb-avg">${cw.avg}점</div><div class="cb-sub">1-2점 ${cw.pct}% · ${CELL_STORES[c].length}개 매장</div></div>
    </button>`;
  }).join('');

  const cells=['1셀','2셀','3셀'];
  const _accCells = ACC_DATA[curMonth]?.accCell || {};
  const chartAvgs   = isAcc() ? cells.map(c=>_accCells[c]?.avg  ||0) : cells.map(c=>(cfg.cellWeek?.[c]?.[wk]?.avg  )||0);
  const chartPcts   = isAcc() ? cells.map(c=>_accCells[c]?.pct  ||0) : cells.map(c=>(cfg.cellWeek?.[c]?.[wk]?.pct  )||0);
  const chartTotals = isAcc() ? cells.map(c=>_accCells[c]?.total||0) : cells.map(c=>(cfg.cellWeek?.[c]?.[wk]?.total)||0);
  const chartLows   = isAcc() ? cells.map(c=>_accCells[c]?.low  ||0) : cells.map(c=>(cfg.cellWeek?.[c]?.[wk]?.low  )||0);
  const y2max = Math.max(Math.ceil(Math.max(...chartPcts)/0.35),8);

  const _accTopMap = {};
  if(isAcc()){ (ACC_DATA[curMonth]?.accTop||[]).forEach(r=>{ _accTopMap[r.store]=r; }); }
  const stores = isAcc()
    ? [...CELL_STORES[cell]].sort((a,b)=>(_accTopMap[b]?.pct||0)-(_accTopMap[a]?.pct||0))
    : [...CELL_STORES[cell]].sort((a,b)=>(cfg.storeWeek?.[b]?.[wk]?.p||0)-(cfg.storeWeek?.[a]?.[wk]?.p||0));
  let rows='';
  stores.forEach(store=>{
    const _accD = isAcc() ? (_accTopMap[store] || {total:0,low:0,pct:0.0,avg:0}) : null;
    const _swRaw = cfg.storeWeek?.[store]?.[wk];
    const sw = isAcc() ? {t:_accD.total,l:_accD.low,p:_accD.pct,a:_accD.avg} : (_swRaw||{t:0,l:0,p:0.0,a:0.0});
    const sp=prev?(cfg.storeWeek?.[store]?.[prev]||null):null;
    const bw=Math.min(sw.p/20*90,90);
    let dc='';
    if(wk!=='w1'&&sp){
      const d=+(sw.p-sp.p).toFixed(1);
      dc=d>0?`<span class="dcu">▲${Math.abs(d)}%p</span>`:d<0?`<span class="dcd">▼${Math.abs(d)}%p</span>`:`<span class="dce">-</span>`;
    }
    rows+=`<tr onclick="openDrawer('${store.replace(/'/g,"\\'")}','${isAcc()?'acc':wk}')">
      <td class="snm">${store}</td>
      <td><span class="ln">${sw.l}건</span><span class="tn"> / ${sw.t}건</span></td>
      <td><div class="bw"><div class="bb" style="width:${bw}px"></div><span class="pn ${pc(sw.p)}">${sw.p}%</span>${dc}</div></td>
      <td><span class="${ac(sw.a)}">${sw.a}</span></td>
    </tr>`;
  });

  let dH='';
  if(prevD){
    const r=+(cur.pct-prevD.pct).toFixed(1);
    const up=r>0;
    dH=r===0?'<span style="color:var(--text-sub);font-size:11px">= 전주 동일</span>'
      :`<span style="font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:${up?'#FEE2E2':'var(--green-light)'};color:${up?'var(--danger)':'var(--green-dark)'};display:inline-block">${up?'▲':'▼'} ${Math.abs(r)}%p</span>`;
  } else dH='<span style="color:var(--text-sub);font-size:11px">— (비교 없음)</span>';

  document.getElementById('main-content').innerHTML=`
    <div class="section">
      <div class="stitle">📊 ${wLabel} 셀별 평균 평점 &amp; 1-2점 비율<span class="ssub">3개 셀 비교 · 아래에서 셀 선택 시 매장 테이블 변경</span></div>
      <div class="chart-wrap"><canvas id="cell-chart"></canvas></div>
    </div>
    <div class="section">
      <div class="stitle" style="margin-bottom:12px">셀 선택</div>
      <div class="cell-selector">${cellBtns}</div>
    </div>
    <div class="section">
      <div class="stitle">🏢 ${wLabel} ${cell} 매장별 현황<span class="ssub">저평점 비율순 · 행 클릭 시 리뷰</span>
        <span style="margin-left:auto;font-size:12px;font-weight:400">${cell} 저평점 ${cur.pct}% ${dH}</span>
      </div>
      <table>
        <thead><tr><th>매장명</th><th>저평점</th><th>저평점 비율${wk!=='w1'?' (▲▼ 전주)':''}</th><th>평균 평점</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  setTimeout(()=>drawChart(wk,chartAvgs,chartPcts,chartTotals,chartLows,y2max),30);
}

function drawChart(wk,avgs,pcts,totals,lows,y2max){
  // 누적탭 포함 항상 차트 렌더링
  const canvas=document.getElementById('cell-chart'); if(!canvas) return;
  const cid=curMonth+wk;
  if(charts[cid]){charts[cid].destroy();delete charts[cid];}
  charts[cid]=new Chart(canvas.getContext('2d'),{
    data:{
      labels:['1셀','2셀','3셀'],
      datasets:[
        {type:'bar',label:'1-2점 비율(%)',data:pcts,
          backgroundColor:'rgba(92,184,122,0.75)',borderColor:'rgba(45,125,70,0.9)',
          borderWidth:1.5,borderRadius:6,yAxisID:'y2',order:2,barPercentage:0.45,categoryPercentage:0.6},
        {type:'line',label:'평균 평점',data:avgs,
          borderColor:'#1B5E34',backgroundColor:'rgba(45,125,70,0.06)',
          borderWidth:2.5,pointBackgroundColor:'#2D7D46',pointRadius:6,pointHoverRadius:8,
          tension:0.3,yAxisID:'y1',order:1}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,animation:{duration:500},
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'top',labels:{font:{size:11},boxWidth:12,padding:16}},
        tooltip:{callbacks:{afterBody:(items)=>{const i=items[0].dataIndex;return[`총 리뷰: ${totals[i]}건`,`저평점: ${lows[i]}건`];}}}
      },
      scales:{
        y1:{type:'linear',position:'left',min:4.0,max:5.2,title:{display:true,text:'평균 평점',font:{size:10},color:'#1B5E34'},ticks:{font:{size:10},color:'#1B5E34',stepSize:0.2}},
        y2:{type:'linear',position:'right',min:0,max:y2max,title:{display:true,text:'1-2점 비율(%)',font:{size:10},color:'#4CAF6E'},ticks:{font:{size:10},callback:v=>v+'%',color:'#4CAF6E'},grid:{drawOnChartArea:false}},
        x:{ticks:{font:{size:13},color:'#1A2E1A',padding:6}}
      }
    }
  });
}

    ?'<div class="norv">✅ 해당 주차 저평점 리뷰 없음</div>'
    :reviews.map(r=>`<div class="rv"><div class="rm">

        ${r.week?`<span style="font-size:10px;font-weight:700;background:var(--green-light);color:var(--green-dark);padding:1px 6px;border-radius:4px">${MONTH_CONFIG[curMonth].weekLabels[(MONTH_CONFIG[curMonth].weeks||[]).indexOf(r.week)]||r.week}</span>`:'' }
        <span class="rd">${r.date}</span>
      </div><div class="rt">${r.content}</div></div>`).join('');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}
window.addEventListener('DOMContentLoaded',()=>{
  buildTabs();
  render();
  // 주차 탭: 이벤트 위임 (DOM 재생성해도 항상 동작)
  document.getElementById('tabs').addEventListener('click', e=>{
    const tab = e.target.closest('.tab');
    if(!tab) return;
    curWeek = tab.dataset.week;
    render();
  });
  // 월 탭
  document.querySelectorAll('.mtab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.mtab').forEach(m=>m.classList.remove('active'));
    t.classList.add('active');
    curMonth = t.dataset.month;
    curWeek = 'w1';
    buildTabs();
    render();
  }));
});
</script>
</body>
</html>
