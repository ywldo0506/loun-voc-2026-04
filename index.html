<style>
:root{--green:#2D7D46;--green-mid:#4CAF6E;--green-light:#E8F5ED;--green-pale:#F4FBF6;--green-dark:#1B5E34;--green-bar:#5CB87A;--danger:#DC2626;--danger-light:#FEF2F2;--warning:#D97706;--border:#E2E8F0;--bg:#F5F7F5;--white:#FFFFFF;--text:#1A2E1A;--text-muted:#5A7A5A;--text-sub:#8FA88F;}

body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
.header{background:var(--white);border-bottom:2px solid var(--green-light);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 6px rgba(45,125,70,.08);}

.htitle{font-size:18px;font-weight:800;color:var(--green-dark);}
.hsub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.badges{display:flex;gap:8px;}
.badge{font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;}
.bg{background:var(--green-light);color:var(--green-dark);}
.br{background:var(--danger-light);color:var(--danger);}
.month-tabs{background:var(--green-dark);display:flex;}
.mtab{padding:10px 28px;cursor:pointer;color:rgba(255,255,255,.6);font-size:13px;font-weight:600;border-bottom:3px solid transparent;transition:all .15s;}
.mtab:hover{color:#fff;}
.mtab.active{color:#fff;border-bottom-color:var(--green-mid);}
.tabs{background:var(--white);border-bottom:1px solid var(--border);padding:0 28px;display:flex;}
.tab{padding:12px 20px;cursor:pointer;border-bottom:3px solid transparent;color:var(--text-muted);transition:all .15s;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;}
.tab .tl{font-size:13px;font-weight:600;}
.tab .td{font-size:10px;color:var(--text-sub);}
.tab:hover{color:var(--green);}
.tab.active{color:var(--green-dark);border-bottom-color:var(--green);background:var(--green-pale);}
.tab.active .tl{font-weight:800;}
.content{padding:20px 28px;max-width:1200px;}
.section{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:20px;}
.stitle{font-size:14px;font-weight:800;color:var(--green-dark);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.ssub{font-size:11px;color:var(--text-muted);font-weight:400;background:var(--bg);padding:2px 8px;border-radius:10px;}

.cb-r{text-align:right;}
.cb-avg{font-size:18px;font-weight:800;color:var(--text-muted);}
.cb-sub{font-size:10px;color:var(--text-sub);margin-top:2px;}
.cell-btn.active{border-color:var(--green);background:var(--green-pale);}
.cell-btn.active .cb-dot{background:var(--green);}
.cell-btn.active .cb-name,.cell-btn.active .cb-avg{color:var(--green-dark);}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{background:var(--green-pale);padding:10px 12px;font-weight:700;font-size:11px;color:var(--green-dark);text-align:left;border-bottom:2px solid var(--green-light);}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}

tbody tr:hover{background:var(--green-pale);cursor:pointer;}
.snm{font-weight:700;}
.ln{font-weight:800;color:var(--danger);}
.tn{color:var(--text-muted);font-size:12px;}
.bw{display:flex;align-items:center;gap:8px;}
.bb{height:7px;border-radius:4px;background:var(--green-bar);}
.pn{font-size:12px;font-weight:800;min-width:38px;}
.pr{color:var(--danger);}.po{color:var(--warning);}.pg{color:var(--green);}
.ab{color:var(--danger);font-weight:700;}.ao{color:var(--warning);font-weight:700;}.ag{color:var(--green);font-weight:700;}

.rvb{font-size:11px;color:var(--green-dark);background:var(--green-light);border:none;padding:3px 8px;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:600;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;}
.overlay.open{display:block;}
.drawer{position:fixed;right:0;top:0;bottom:0;width:500px;background:var(--white);z-index:201;overflow-y:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:-6px 0 30px rgba(0,0,0,.14);}
.drawer.open{transform:translateX(0);}
.dh{padding:18px 22px;border-bottom:2px solid var(--green-light);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--white);z-index:10;}
.dh h3{font-size:14px;font-weight:800;color:var(--green-dark);flex:1;min-width:0;margin-right:8px;}
.dwt{font-size:11px;font-weight:700;background:var(--green-light);color:var(--green-dark);padding:3px 9px;border-radius:10px;white-space:nowrap;}
.dcb{cursor:pointer;background:none;border:none;font-size:22px;color:var(--text-muted);padding:2px 8px;border-radius:6px;flex-shrink:0;}
.db{padding:16px 22px;}
.rv{border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-bottom:10px;}
.rm{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap;}
.sc{font-size:12px;font-weight:800;padding:2px 9px;border-radius:12px;}

.rt{font-size:13px;line-height:1.7;word-break:keep-all;}
.norv{text-align:center;padding:48px 20px;color:var(--text-muted);}
@media(max-width:768px){.cell-selector{flex-direction:column;}.drawer{width:100%;}.content{padding:14px 16px;}}
</style>

const APR_CELL_WEEK={
  '1셀':{w1:{total:144,low:3,pct:2.1,avg:4.61},w2:{total:204,low:11,pct:5.4,avg:4.57},w3:{total:256,low:10,pct:3.9,avg:4.55},w4:{total:217,low:11,pct:5.1,avg:4.52},w5:{total:117,low:2,pct:1.7,avg:4.65}},
  '2셀':{w1:{total:94,low:1,pct:1.1,avg:4.76},w2:{total:144,low:3,pct:2.1,avg:4.73},w3:{total:129,low:0,pct:0.0,avg:4.77},w4:{total:160,low:5,pct:3.1,avg:4.69},w5:{total:84,low:0,pct:0.0,avg:4.88}},
  '3셀':{w1:{total:127,low:4,pct:3.1,avg:4.61},w2:{total:196,low:9,pct:4.6,avg:4.52},w3:{total:183,low:5,pct:2.7,avg:4.57},w4:{total:191,low:4,pct:2.1,avg:4.67},w5:{total:104,low:4,pct:3.8,avg:4.57}}

const MAY_CELL_WEEK={
  '1셀':{w1:{total:158,low:2,pct:1.3,avg:4.53},w2:{total:294,low:4,pct:1.4,avg:4.57},w3:{total:193,low:2,pct:1.0,avg:4.66},w4:{total:213,low:2,pct:0.9,avg:4.67},w5:{total:168,low:4,pct:2.4,avg:4.59}},
  '2셀':{w1:{total:111,low:2,pct:1.8,avg:4.66},w2:{total:175,low:8,pct:4.6,avg:4.60},w3:{total:134,low:3,pct:2.2,avg:4.69},w4:{total:156,low:2,pct:1.3,avg:4.72},w5:{total:116,low:5,pct:4.3,avg:4.73}},
  '3셀':{w1:{total:126,low:10,pct:7.9,avg:4.39},w2:{total:254,low:10,pct:3.9,avg:4.52},w3:{total:183,low:3,pct:1.6,avg:4.62},w4:{total:206,low:8,pct:3.9,avg:4.50},w5:{total:155,low:2,pct:1.3,avg:4.57}}
};

const MONTH_CONFIG={
  apr:{label:'4월',weeks:['w1','w2','w3','w4','w5'],weekLabels:['1주차','2주차','3주차','4주차','5주차'],
    weekDates:{w1:'4/1~4/5',w2:'4/6~4/12',w3:'4/13~4/19',w4:'4/20~4/26',w5:'4/27~4/30'},
    cellWeek:APR_CELL_WEEK,storeWeek:APR_SW,reviews:REVIEWS_BY_WEEK,
    badge:{avg:'4.62점',pct:'1-2점 72건 · 3.1%'}},
  may:{label:'5월',weeks:['w1','w2','w3','w4','w5'],weekLabels:['1주차','2주차','3주차','4주차','5주차'],
    weekDates:{w1:'5/1~5/4',w2:'5/5~5/11',w3:'5/12~5/18',w4:'5/19~5/25',w5:'5/26~5/31'},
    cellWeek:MAY_CELL_WEEK,storeWeek:MAY_SW,reviews:REVIEWS_MAY,
    badge:{avg:'4.59점',pct:'1-2점 67건 · 2.5%'}}
};
const CELL_STORES={
  '1셀':['로운 NC 강서점','로운 NC 야탑점','로운 NC 송파점','로운샤브 프리미엄 이마트 의정부점','로운 뉴코아 일산점'],
  '2셀':['로운 NC 순천점','로운 뉴코아 괴정점','로운 NC 광주역점','로운 NC 부산대점','로운샤브 프리미엄 이마트 해운대점','로운 롯데백화점 청량리점'],
  '3셀':['로운 신촌점','로운 NC 수원터미널점','로운 NC 중앙로역점','로운 뉴코아 평촌점','로운샤브 프리미엄 스타필드마켓 동탄점','로운샤브 프리미엄 롯데몰 광명점']
};

const labelPlugin={
  id:'customLabels',
  afterDraw(chart){
    const ctx=chart.ctx; ctx.save();
    chart.data.datasets.forEach((ds,di)=>{
      const meta=chart.getDatasetMeta(di); if(meta.hidden) return;
      meta.data.forEach((el,i)=>{
        const val=ds.data[i]; if(val===0||val==null) return;
        if(ds.type==='bar'){
          const bH=el.base-el.y; if(bH<14) return;
          ctx.font='bold 11px Pretendard,-apple-system,sans-serif';
          ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(val+'%',el.x,el.y+bH/2);
        } else {
          ctx.font='bold 11px Pretendard,-apple-system,sans-serif';
          ctx.fillStyle='#1B5E34'; ctx.textAlign='center'; ctx.textBaseline='bottom';
          ctx.fillText(String(val),el.x,el.y-8);
        }
      });
    });
    ctx.restore();
  }
};
Chart.register(labelPlugin);

let curMonth='apr',curWeek='w1',curCell='1셀';
const charts={};

function getPrev(wk,weeks){const i=weeks.indexOf(wk);return i>0?weeks[i-1]:null;}
function pc(p){return p>=5?'pr':p>=3?'po':'pg';}
function ac(a){return a<4.4?'ab':a<4.6?'ao':'ag';}

function buildTabs(){
  const cfg=MONTH_CONFIG[curMonth];
  document.getElementById('tabs').innerHTML=cfg.weeks.map((wk,i)=>
    `<div class="tab${wk===curWeek?' active':''}" data-week="${wk}">
      <span class="tl">${cfg.weekLabels[i]}</span><span class="td">${cfg.weekDates[wk]}</span>
    </div>`).join('');
  document.getElementById('tabs').querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    curWeek=t.dataset.week; render();
  }));
  document.getElementById('hbadges').innerHTML=
    `<div class="badge bg">${cfg.badge.avg}</div><div class="badge br">${cfg.badge.pct}</div>`;
}

function render(){
  const cfg=MONTH_CONFIG[curMonth];
  const wk=curWeek, cell=curCell;
  const prev=getPrev(wk,cfg.weeks);
  const cData=cfg.cellWeek[cell];
  const cur=cData[wk], prevD=prev?cData[prev]:null;
  const wLabel=cfg.weekLabels[cfg.weeks.indexOf(wk)];

  const cellBtns=['1셀','2셀','3셀'].map(c=>{
    const cw=cfg.cellWeek[c][wk];
    return `<button class="cell-btn${c===cell?' active':''}" onclick="selectCell('${c}')">
      <div class="cb-l"><div class="cb-dot"></div><div class="cb-name">${c}</div></div>
      <div class="cb-r"><div class="cb-avg">${cw.avg}점</div><div class="cb-sub">1-2점 ${cw.pct}% · ${CELL_STORES[c].length}개 매장</div></div>
    </button>`;
  }).join('');

  const cells=['1셀','2셀','3셀'];
  const chartAvgs=cells.map(c=>cfg.cellWeek[c][wk].avg);
  const chartPcts=cells.map(c=>cfg.cellWeek[c][wk].pct);
  const chartTotals=cells.map(c=>cfg.cellWeek[c][wk].total);
  const chartLows=cells.map(c=>cfg.cellWeek[c][wk].low);
  const y2max=Math.max(Math.ceil(Math.max(...chartPcts)/0.35),8);

  const stores=[...CELL_STORES[cell]].sort((a,b)=>cfg.storeWeek[b][wk].p-cfg.storeWeek[a][wk].p);
  let rows='';
  stores.forEach(store=>{
    const sw=cfg.storeWeek[store][wk], sp=prev?cfg.storeWeek[store][prev]:null;
    const bw=Math.min(sw.p/20*90,90);
    let dc='';
    if(wk!=='w1'&&sp){
      const d=+(sw.p-sp.p).toFixed(1);
      dc=d>0?`<span class="dcu">▲${Math.abs(d)}%p</span>`:d<0?`<span class="dcd">▼${Math.abs(d)}%p</span>`:`<span class="dce">-</span>`;
    }
    const rvCnt=(cfg.reviews[store]||{})[wk]?.length||0;
    rows+=`<tr onclick="openDrawer('${store.replace(/'/g,"\\'")}','${wk}')">
      <td class="snm">${store}</td>
      <td><span class="ln">${sw.l}건</span><span class="tn"> / ${sw.t}건</span></td>
      <td><div class="bw"><div class="bb" style="width:${bw}px"></div><span class="pn ${pc(sw.p)}">${sw.p}%</span>${dc}</div></td>
      <td><span class="${ac(sw.a)}">${sw.a}</span></td>
      <td>${rvCnt>0?`<button class="rvb">📋 ${rvCnt}건</button>`:'—'}</td>
    </tr>`;
  });

  let dH='';
  if(prevD){
    const r=+(cur.pct-prevD.pct).toFixed(1);
    const up=r>0;
    dH=r===0?'<span style="color:var(--text-sub);font-size:11px">= 전주 동일</span>'
      :`<span style="font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;background:${up?'#FEE2E2':'var(--green-light)'};color:${up?'var(--danger)':'var(--green-dark)'};display:inline-block">${up?'▲':'▼'} ${Math.abs(r)}%p</span>`;
  } else dH='<span style="color:var(--text-sub);font-size:11px">— (비교 없음)</span>';

  document.getElementById('main-content').innerHTML=`
    <div class="section">
      <div class="stitle">📊 ${wLabel} 셀별 평균 평점 &amp; 1-2점 비율<span class="ssub">3개 셀 비교 · 아래에서 셀 선택 시 매장 테이블 변경</span></div>
      <div class="chart-wrap"><canvas id="cell-chart"></canvas></div>
    </div>
    <div class="section">
      <div class="stitle" style="margin-bottom:12px">셀 선택</div>
      <div class="cell-selector">${cellBtns}</div>
    </div>
    <div class="section">
      <div class="stitle">🏢 ${wLabel} ${cell} 매장별 현황<span class="ssub">저평점 비율순 · 행 클릭 시 리뷰</span>
        <span style="margin-left:auto;font-size:12px;font-weight:400">${cell} 저평점 ${cur.pct}% ${dH}</span>
      </div>
      <table>
        <thead><tr><th>매장명</th><th>저평점</th><th>저평점 비율${wk!=='w1'?' (▲▼ 전주)':''}</th><th>평균 평점</th><th>리뷰</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  setTimeout(()=>drawChart(wk,chartAvgs,chartPcts,chartTotals,chartLows,y2max),30);
}

function drawChart(wk,avgs,pcts,totals,lows,y2max){
  const canvas=document.getElementById('cell-chart'); if(!canvas) return;
  const cid=curMonth+wk;
  if(charts[cid]){charts[cid].destroy();delete charts[cid];}
  charts[cid]=new Chart(canvas.getContext('2d'),{
    data:{
      labels:['1셀','2셀','3셀'],
      datasets:[
        {type:'bar',label:'1-2점 비율(%)',data:pcts,
          backgroundColor:'rgba(92,184,122,0.75)',borderColor:'rgba(45,125,70,0.9)',
          borderWidth:1.5,borderRadius:6,yAxisID:'y2',order:2,barPercentage:0.45,categoryPercentage:0.6},
        {type:'line',label:'평균 평점',data:avgs,
          borderColor:'#1B5E34',backgroundColor:'rgba(45,125,70,0.06)',
          borderWidth:2.5,pointBackgroundColor:'#2D7D46',pointRadius:6,pointHoverRadius:8,
          tension:0.3,yAxisID:'y1',order:1}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,animation:{duration:500},
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'top',labels:{font:{size:11},boxWidth:12,padding:16}},
        tooltip:{callbacks:{afterBody:(items)=>{const i=items[0].dataIndex;return[`총 리뷰: ${totals[i]}건`,`저평점: ${lows[i]}건`];}}}
      },
      scales:{
        y1:{type:'linear',position:'left',min:4.0,max:5.2,title:{display:true,text:'평균 평점',font:{size:10},color:'#1B5E34'},ticks:{font:{size:10},color:'#1B5E34',stepSize:0.2}},
        y2:{type:'linear',position:'right',min:0,max:y2max,title:{display:true,text:'1-2점 비율(%)',font:{size:10},color:'#4CAF6E'},ticks:{font:{size:10},callback:v=>v+'%',color:'#4CAF6E'},grid:{drawOnChartArea:false}},
        x:{ticks:{font:{size:13},color:'#1A2E1A',padding:6}}
      }
    }
  });
}

function selectCell(c){curCell=c;render();}
function openDrawer(store,wk){
  const cfg=MONTH_CONFIG[curMonth];
  const reviews=(cfg.reviews[store]||{})[wk]||[];
  document.getElementById('d-title').textContent=store;
  document.getElementById('d-wtag').textContent=cfg.weekLabels[cfg.weeks.indexOf(wk)]+' 저평점 리뷰';
  document.getElementById('d-body').innerHTML=reviews.length===0
    ?'<div class="norv">✅ 해당 주차 저평점 리뷰 없음</div>'
    :reviews.map(r=>`<div class="rv"><div class="rm"><span class="sc sc${r.score}">${r.score}점</span><span class="rd">${r.date}</span></div><div class="rt">${r.content}</div></div>`).join('');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}
document.querySelectorAll('.mtab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.mtab').forEach(m=>m.classList.remove('active'));
  t.classList.add('active');
  curMonth=t.dataset.month; curWeek='w1';
  buildTabs(); render();
}));
window.addEventListener('DOMContentLoaded',()=>{buildTabs();render();});
</script>
